# Recommender evaluation scenarios with graded relevance labels.
#   2 = good choice, 1 = acceptable, unlisted = unsuitable (0).
#
# Written on 2026-11-08 from the garment names and photos, BEFORE running evaluation/rec_eval.py on
# this catalogue. Honest caveat: the same author (the AI assistant used on the project) also wrote the
# knowledge base and the manual annotations, so agreement is likely optimistic. An independent re-labelling
# by the project owner (or a classmate) is planned; record it as a second labeller below and compare.
meta:
  catalogue: data/catalogue/clothing_catalogue.csv (52 garments, cd_001-cd_052)
  labeller: AI assistant (Claude), from images and names, before running the evaluation
  date: 2026-11-08

scenarios:
  - name: Interview, indoor, mild - tops
    context: {occasion: interview, setting: indoor, weather: mild, categories: [upper]}
    relevance: {cd_002: 2, cd_004: 2, cd_039: 2, cd_036: 2, cd_007: 2, cd_035: 1, cd_008: 1, cd_018: 1}

  - name: Interview, indoor, mild - bottoms
